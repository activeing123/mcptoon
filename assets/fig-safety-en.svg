<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 400" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f1f7f2"/>
    </linearGradient>
    <linearGradient id="strip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2ea043"/><stop offset="1" stop-color="#1a7f37"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ea043"/><stop offset="1" stop-color="#1a7f37"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dy="7"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.20"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <marker id="arw" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/>
    </marker>
    <marker id="arwg" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/>
    </marker>
  </defs>

<rect x="0.5" y="0.5" width="1179" height="399" rx="18" fill="url(#bg)" stroke="#d0d7de"/>
<circle cx="165" cy="80" r="168" fill="#2ea043" opacity="0.055"/><circle cx="1038" cy="328" r="160" fill="#bf8700" opacity="0.045"/>
<rect x="0.5" y="0.5" width="1179" height="399" rx="18" filter="url(#grain)" opacity="0.045"/>
<text x="590" y="50" font-size="28" fill="#1f2328" text-anchor="middle" font-weight="800">Safe by default</text>
<text x="590" y="80" font-size="14.5" fill="#57606a" text-anchor="middle">Destructive actions blocked by default; results scanned twice; no attack surface</text>
<rect x="50" y="112" width="254" height="204" rx="14" fill="#ffffff" stroke="#d0d7de" filter="url(#soft)"/>
<rect x="50" y="112" width="254" height="72" rx="14" fill="url(#strip)"/>
<rect x="50" y="160" width="254" height="24" fill="url(#strip)"/>
<circle cx="177" cy="148" r="24" fill="#ffffff" opacity="0.20"/>
<g transform="translate(177,148) scale(1.3)" fill="none" stroke="#ffffff" stroke-width="2"><rect x="-6.5" y="-1.5" width="13" height="10" rx="2.2"/><path d="M-4,-1.5 L-4,-5 A4,4 0 0 1 4,-5 L4,-1.5"/><circle cx="0" cy="3.6" r="1.3" fill="#ffffff" stroke="none"/></g>
<text x="177" y="216" font-size="15.5" fill="#1f2328" text-anchor="middle" font-weight="800">Destructive blocked</text>
<text x="177" y="244" font-size="13" fill="#57606a" text-anchor="middle">Delete-class actions refused</text>
<text x="177" y="264" font-size="13" fill="#57606a" text-anchor="middle">unless --destructive is passed</text>
<rect x="120" y="284" width="114" height="5" rx="2.5" fill="#1a7f37"/>
<rect x="327" y="112" width="254" height="204" rx="14" fill="#ffffff" stroke="#d0d7de" filter="url(#soft)"/>
<rect x="327" y="112" width="254" height="72" rx="14" fill="url(#strip)"/>
<rect x="327" y="160" width="254" height="24" fill="url(#strip)"/>
<circle cx="454" cy="148" r="24" fill="#ffffff" opacity="0.20"/>
<g transform="translate(454,148) scale(1.3)" fill="none" stroke="#ffffff" stroke-width="2"><path d="M-8.5,0 Q0,-6.5 8.5,0 Q0,6.5 -8.5,0 Z"/><circle cx="0" cy="0" r="2.6" fill="#ffffff" stroke="none"/></g>
<text x="454" y="216" font-size="15.5" fill="#1f2328" text-anchor="middle" font-weight="800">Injection scan</text>
<text x="454" y="244" font-size="13" fill="#57606a" text-anchor="middle">Result text scanned for</text>
<text x="454" y="264" font-size="13" fill="#57606a" text-anchor="middle">prompt-injection patterns</text>
<rect x="397" y="284" width="114" height="5" rx="2.5" fill="#1a7f37"/>
<rect x="604" y="112" width="254" height="204" rx="14" fill="#ffffff" stroke="#d0d7de" filter="url(#soft)"/>
<rect x="604" y="112" width="254" height="72" rx="14" fill="url(#strip)"/>
<rect x="604" y="160" width="254" height="24" fill="url(#strip)"/>
<circle cx="731" cy="148" r="24" fill="#ffffff" opacity="0.20"/>
<g transform="translate(731,148) scale(1.3)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"><circle cx="-1" cy="-1" r="5.5"/><line x1="3" y1="3" x2="7.5" y2="7.5"/></g>
<text x="731" y="216" font-size="15.5" fill="#1f2328" text-anchor="middle" font-weight="800">Credential scan</text>
<text x="731" y="244" font-size="13" fill="#57606a" text-anchor="middle">Tokens and secrets in results</text>
<text x="731" y="264" font-size="13" fill="#57606a" text-anchor="middle">are detected and flagged</text>
<rect x="674" y="284" width="114" height="5" rx="2.5" fill="#1a7f37"/>
<rect x="881" y="112" width="254" height="204" rx="14" fill="#ffffff" stroke="#d0d7de" filter="url(#soft)"/>
<rect x="881" y="112" width="254" height="72" rx="14" fill="url(#strip)"/>
<rect x="881" y="160" width="254" height="24" fill="url(#strip)"/>
<circle cx="1008" cy="148" r="24" fill="#ffffff" opacity="0.20"/>
<g transform="translate(1008,148) scale(1.3)"><path d="M0,-9 L8,-5.4 L8,1.6 Q0,8.6 0,9 Q0,8.6 -8,1.6 L-8,-5.4 Z" fill="#ffffff"/><path d="M-3.2,0 L-0.8,2.6 L3.6,-2.6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="1008" y="216" font-size="15.5" fill="#1f2328" text-anchor="middle" font-weight="800">No attack surface</text>
<text x="1008" y="244" font-size="13" fill="#57606a" text-anchor="middle">No telemetry, no stored creds</text>
<text x="1008" y="264" font-size="13" fill="#57606a" text-anchor="middle">no daemon, zero dependencies</text>
<rect x="951" y="284" width="114" height="5" rx="2.5" fill="#1a7f37"/>
<rect x="330" y="344" width="520" height="34" rx="10" fill="#eaf6ec"/>
<text x="590" y="366" font-size="14" fill="#1a7f37" text-anchor="middle" font-weight="700">Apache-2.0 · runs locally · works with no network</text>
</svg>
