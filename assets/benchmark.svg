<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420">
  <style>
    .bg { fill: #0d1117; }
    .title { fill: #58a6ff; font: bold 20px sans-serif; }
    .subtitle { fill: #8b949e; font: 13px sans-serif; }
    .bar-json { fill: #f85149; }
    .bar-toon { fill: #3fb950; }
    .bar-slim { fill: #58a6ff; }
    .bar-compact { fill: #d2a8ff; }
    .label { fill: #c9d1d9; font: 11px monospace; }
    .value { fill: #e6edf3; font: bold 11px monospace; }
    .axis { fill: #484f58; font: 10px sans-serif; }
    .legend { fill: #c9d1d9; font: 12px sans-serif; }
  </style>

  <!-- Background -->
  <rect class="bg" width="800" height="420" rx="12"/>

  <!-- Title -->
  <text class="title" x="30" y="35">mcptoon Benchmark: 255 tools (tiktoken cl100k_base)</text>
  <text class="subtitle" x="30" y="55">Token consumption comparison (lower = better)</text>

  <!-- Legend -->
  <rect class="bar-json" x="460" y="30" width="12" height="12" rx="2"/>
  <text class="legend" x="478" y="40">JSON</text>
  <rect class="bar-toon" x="520" y="30" width="12" height="12" rx="2"/>
  <text class="legend" x="538" y="40">TOON</text>
  <rect class="bar-slim" x="580" y="30" width="12" height="12" rx="2"/>
  <text class="legend" x="598" y="40">SLIM</text>
  <rect class="bar-compact" x="640" y="30" width="12" height="12" rx="2"/>
  <text class="legend" x="658" y="40">Compact</text>

  <!-- Chart area: x=60..740, y=80..360 -->
  <!-- Max value = 71929, scale: 280px / 71929 = 0.003893 -->
  <!-- 3 bar groups: 5, 50, 255 -->

  <!-- 5 tools: JSON=1519, TOON=1003, SLIM=147, compact=11 -->
  <!-- Scale: 1519*0.003893=5.9, 1003*0.003893=3.9, 147*0.003893=0.6, 11*0.003893=0.04 -->
  <rect class="bar-json" x="120" y="354" width="22" height="6" rx="1"/>
  <text class="value" x="131" y="349" text-anchor="middle">1.5K</text>
  <rect class="bar-toon" x="146" y="356" width="22" height="4" rx="1"/>
  <text class="value" x="157" y="351" text-anchor="middle">1.0K</text>
  <rect class="bar-slim" x="172" y="359" width="22" height="1" rx="1"/>
  <text class="value" x="183" y="354" text-anchor="middle">147</text>
  <rect class="bar-compact" x="198" y="359" width="22" height="1" rx="1"/>
  <text class="value" x="209" y="354" text-anchor="middle">11</text>
  <text class="label" x="170" y="375" text-anchor="middle">5</text>

  <!-- 50 tools: JSON=14113, TOON=9287, SLIM=1624, compact=114 -->
  <!-- Scale: 14113*0.003893=54.9, 9287*0.003893=36.1, 1624*0.003893=6.3, 114*0.003893=0.44 -->
  <rect class="bar-json" x="320" y="305" width="22" height="55" rx="1"/>
  <text class="value" x="331" y="300" text-anchor="middle">14.1K</text>
  <rect class="bar-toon" x="346" y="324" width="22" height="36" rx="1"/>
  <text class="value" x="357" y="319" text-anchor="middle">9.3K</text>
  <rect class="bar-slim" x="372" y="354" width="22" height="6" rx="1"/>
  <text class="value" x="383" y="349" text-anchor="middle">1.6K</text>
  <rect class="bar-compact" x="398" y="359" width="22" height="1" rx="1"/>
  <text class="value" x="409" y="354" text-anchor="middle">114</text>
  <text class="label" x="370" y="375" text-anchor="middle">50</text>

  <!-- 255 tools: JSON=71929, TOON=47438, SLIM=8282, compact=581 -->
  <!-- Scale: 71929*0.003893=280, 47438*0.003893=184.7, 8282*0.003893=32.2, 581*0.003893=2.3 -->
  <rect class="bar-json" x="520" y="80" width="22" height="280" rx="1"/>
  <text class="value" x="531" y="75" text-anchor="middle">71.9K</text>
  <rect class="bar-toon" x="546" y="175" width="22" height="185" rx="1"/>
  <text class="value" x="557" y="170" text-anchor="middle">47.4K</text>
  <rect class="bar-slim" x="572" y="328" width="22" height="32" rx="1"/>
  <text class="value" x="583" y="323" text-anchor="middle">8.3K</text>
  <rect class="bar-compact" x="598" y="358" width="22" height="2" rx="1"/>
  <text class="value" x="609" y="353" text-anchor="middle">581</text>
  <text class="label" x="570" y="375" text-anchor="middle">255</text>

  <!-- Baseline -->
  <line x1="60" y1="360" x2="740" y2="360" stroke="#30363d" stroke-width="1"/>

  <!-- X axis label -->
  <text class="axis" x="400" y="395" text-anchor="middle">Number of MCP tools</text>

  <!-- Key stat -->
  <text class="subtitle" x="30" y="412">255 tools: JSON 71,929 tokens → name index 581 tokens = −99.2% reduction (tiktoken cl100k_base)</text>
</svg>
