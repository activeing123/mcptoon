<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" fill="none">
  <defs>
    <!-- Background Dark Mesh Gradients -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>

    <!-- Glassmorphic Card Surface Gradients -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.65" />
    </linearGradient>

    <linearGradient id="card-hero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2430" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#121820" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0b1017" stop-opacity="0.9" />
    </linearGradient>

    <!-- Ambient Glow Drops -->
    <radialGradient id="glow-green" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#238636" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#238636" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-blue" cx="80%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0" />
    </radialGradient>

    <!-- Neon Glow Filters -->
    <filter id="neon-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="shadow-card" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <!-- Gradients for Progress Bars -->
    <linearGradient id="bar-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f85149" />
      <stop offset="70%" stop-color="#ff7b72" />
      <stop offset="100%" stop-color="#ffa198" />
    </linearGradient>

    <linearGradient id="bar-toon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d29922" />
      <stop offset="100%" stop-color="#e3b341" />
    </linearGradient>

    <linearGradient id="bar-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2ea043" />
      <stop offset="50%" stop-color="#3fb950" />
      <stop offset="100%" stop-color="#56d364" />
    </linearGradient>

    <!-- Text Gradients -->
    <linearGradient id="txt-emerald" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7ee787" />
      <stop offset="100%" stop-color="#2ea043" />
    </linearGradient>

    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#388bfd" stop-opacity="0.4" />
      <stop offset="40%" stop-color="#30363d" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#238636" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <style>
    .f-mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; }
    .f-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .title { font-size: 22px; font-weight: 800; fill: #f0f6fc; letter-spacing: -0.5px; }
    .sub { font-size: 13px; fill: #8b949e; font-weight: 500; }
    .hero-stat { font-size: 54px; font-weight: 900; fill: url(#txt-emerald); letter-spacing: -1.5px; }
    .hero-label { font-size: 12px; font-weight: 700; fill: #8b949e; letter-spacing: 1px; text-transform: uppercase; }
    .badge-txt { font-size: 11px; font-weight: 700; letter-spacing: 0.5px; }
    .bar-title { font-size: 13px; font-weight: 600; fill: #e6edf3; }
    .bar-meta { font-size: 12px; font-weight: 700; }
    .pill { rx: 6px; }
  </style>

  <!-- Canvas Background -->
  <rect width="960" height="480" rx="16" fill="url(#bg)" stroke="url(#border-glow)" stroke-width="1.2"/>
  <!-- Ambient Radiance -->
  <circle cx="180" cy="180" r="260" fill="url(#glow-green)" />
  <circle cx="820" cy="380" r="240" fill="url(#glow-blue)" />

  <!-- Top Navigation / Titlebar Area -->
  <g transform="translate(40, 36)">
    <!-- Tech Tag -->
    <rect width="132" height="24" rx="12" fill="#238636" fill-opacity="0.15" stroke="#3fb950" stroke-width="1"/>
    <text x="66" y="16" text-anchor="middle" class="f-mono badge-txt" fill="#3fb950">TOKEN CRUNCH</text>

    <!-- Audit Metadata Pill -->
    <g transform="translate(144, 0)">
      <rect width="170" height="24" rx="12" fill="#21262d" stroke="#30363d" stroke-width="1"/>
      <circle cx="14" cy="12" r="4" fill="#388bfd" />
      <text x="26" y="16" class="f-mono badge-txt" fill="#c9d1d9">tiktoken cl100k_base</text>
    </g>

    <!-- Title & Subtitle -->
    <text x="0" y="56" class="f-sans title">Context Tax Benchmark: Standard MCP vs. mcptoon</text>
    <text x="0" y="78" class="f-sans sub">Measured on standard 255-tool real-world catalog · Zero-loss schema abstraction</text>
  </g>

  <!-- Main Body Layout -->

  <!-- Left: Hero Stat HUD Card -->
  <g transform="translate(40, 134)" filter="url(#shadow-card)">
    <rect width="280" height="306" rx="14" fill="url(#card-hero)" stroke="#30363d" stroke-width="1.2"/>

    <!-- Inner Radial Lighting -->
    <circle cx="80" cy="80" r="100" fill="#2ea043" fill-opacity="0.1" />

    <!-- Top Badge -->
    <g transform="translate(24, 24)">
      <rect width="96" height="20" rx="4" fill="#2ea043" fill-opacity="0.2" stroke="#3fb950" stroke-width="0.8"/>
      <text x="48" y="14" text-anchor="middle" class="f-mono badge-txt" fill="#3fb950">OPTIMIZED</text>
    </g>

    <!-- Hero Stat -->
    <g transform="translate(24, 96)">
      <text x="0" y="0" class="f-sans hero-stat" filter="url(#neon-green)">-99.2%</text>
      <text x="2" y="22" class="f-sans hero-label">Context Tax Eradicated</text>
    </g>

    <line x1="24" y1="146" x2="256" y2="146" stroke="#21262d" stroke-width="1.2" />

    <!-- Data Spec Breakdown List -->
    <g transform="translate(24, 172)">
      <text x="0" y="0" class="f-sans sub" font-size="12px">Raw Schema Burden:</text>
      <text x="232" y="0" text-anchor="end" class="f-mono bar-meta" fill="#ff7b72">71,929</text>

      <text x="0" y="28" class="f-sans sub" font-size="12px">mcptoon Compact Index:</text>
      <text x="232" y="28" text-anchor="end" class="f-mono bar-meta" fill="#3fb950">581</text>

      <text x="0" y="56" class="f-sans sub" font-size="12px">Context Left for Prompt:</text>
      <text x="232" y="56" text-anchor="end" class="f-mono bar-meta" fill="#58a6ff">99.5%</text>

      <!-- Mini Savings Pill -->
      <g transform="translate(0, 78)">
        <rect width="232" height="26" rx="6" fill="#1f6feb" fill-opacity="0.1" stroke="#388bfd" stroke-width="1"/>
        <text x="116" y="17" text-anchor="middle" class="f-mono" font-size="11px" font-weight="700" fill="#58a6ff">⚡ 123.8× MORE EFFICIENT</text>
      </g>
    </g>
  </g>

  <!-- Right: Comparison Telemetry Dashboard -->
  <g transform="translate(340, 134)" filter="url(#shadow-card)">
    <rect width="580" height="306" rx="14" fill="url(#card-grad)" stroke="#30363d" stroke-width="1.2"/>

    <!-- Header inside card -->
    <g transform="translate(28, 24)">
      <text x="0" y="0" class="f-sans bar-title" font-size="14px" fill="#c9d1d9">Token Load per LLM Turn (Lower is Better)</text>
    </g>

    <!-- Telemetry Row 1: Standard MCP -->
    <g transform="translate(28, 54)">
      <text x="0" y="0" class="f-sans bar-title">1. Standard MCP Loading (Raw JSON Schema)</text>
      <text x="524" y="0" text-anchor="end" class="f-mono bar-meta" fill="#ff7b72">71,929 tokens (100%)</text>

      <!-- Bar Track -->
      <rect x="0" y="10" width="524" height="26" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1"/>
      <!-- Active Bar with Glow -->
      <rect x="0" y="10" width="524" height="26" rx="6" fill="url(#bar-red)"/>
      <!-- Internal Warning Stamp -->
      <text x="14" y="27" class="f-sans" font-size="11px" font-weight="700" fill="#ffffff" fill-opacity="0.95">⚠️ Consumes >56% of entire 128k context before first turn</text>
    </g>

    <!-- Telemetry Row 2: Raw TOON Transcode -->
    <g transform="translate(28, 126)">
      <text x="0" y="0" class="f-sans bar-title">2. Raw TOON Transcode (Schema Re-encoded)</text>
      <text x="524" y="0" text-anchor="end" class="f-mono bar-meta" fill="#d29922">47,438 tokens (65.9%)</text>

      <!-- Bar Track -->
      <rect x="0" y="10" width="524" height="22" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1"/>
      <!-- Active Bar -->
      <rect x="0" y="10" width="345" height="22" rx="6" fill="url(#bar-toon)"/>
      <text x="14" y="25" class="f-mono" font-size="10px" font-weight="600" fill="#ffffff" fill-opacity="0.8">-34.1% reduction</text>
    </g>

    <!-- Telemetry Row 3: mcptoon Compact Index (THE CHAMPION) -->
    <g transform="translate(28, 194)">
      <text x="0" y="0" class="f-sans bar-title" fill="#7ee787">3. mcptoon Compact Name Index (Default)</text>
      <text x="524" y="0" text-anchor="end" class="f-mono bar-meta" font-size="14px" fill="#3fb950" filter="url(#neon-green)">581 tokens (0.8%)</text>

      <!-- Bar Track -->
      <rect x="0" y="10" width="524" height="28" rx="6" fill="#0b131a" stroke="#238636" stroke-width="1.2"/>
      <!-- Super Compact Bar + Glowing Dot -->
      <rect x="0" y="10" width="18" height="28" rx="6" fill="url(#bar-emerald)" />
      
      <!-- Pulsing Beacon Dot -->
      <circle cx="9" cy="24" r="3.5" fill="#ffffff" />

      <!-- High-Tech Callout -->
      <g transform="translate(30, 10)">
        <text x="0" y="19" class="f-sans" font-size="12px" font-weight="800" fill="#3fb950">
          ⚡ 71,348 Tokens Freed · On-Demand Inspection via `mcptoon inspect`
        </text>
      </g>
    </g>

    <!-- Bottom Footer Inside Card -->
    <g transform="translate(28, 276)">
      <text x="0" y="0" class="f-sans sub" font-size="11px">
        * Tested with Anthropic / OpenAI tokenizers. Tested losslessly: full schemas accessible anytime on disk.
      </text>
    </g>
  </g>
</svg>
