<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 460" font-family="-apple-system,'Segoe UI',sans-serif">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffffff"/>
<stop offset="1" stop-color="#f2f6fa"/>
</linearGradient>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
<feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
<feOffset dy="8" result="off"/>
<feComponentTransfer in="off"><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
<feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="halo" x="-60%" y="-60%" width="220%" height="220%">
<feGaussianBlur stdDeviation="9"/>
</filter>
<marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
<path d="M0,0 L7,3.5 L0,7 z" fill="#8c959f"/>
</marker>
</defs>

<rect x="1" y="1" width="1178" height="458" rx="18" fill="url(#bg)" stroke="#d0d7de"/>

<text x="590" y="54" text-anchor="middle" font-size="34" font-weight="800" fill="#1f2328">One install. Every agent.</text>
<text x="590" y="84" text-anchor="middle" font-size="17" fill="#57606a">The Agent Plugins Spec defines the package. mcptoon ships the installer.</text>

<!-- LEFT: the package -->
<text x="185" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#57606a" letter-spacing="1">THE SPEC: A PACKAGE</text>
<g filter="url(#soft)">
<rect x="48" y="142" width="274" height="232" rx="12" fill="#ffffff" stroke="#d0d7de"/>
</g>
<rect x="68" y="158" width="30" height="22" rx="4" fill="#dbe6f0"/>
<path d="M68 164 h12 l4 5 h14 v11 h-30 z" fill="#8cb8e8"/>
<text x="108" y="176" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#1f2328">my-plugin/</text>
<g>
<rect x="68" y="192" width="234" height="40" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="84" y="217" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="14" fill="#1f2328">plugin.json</text>
<rect x="68" y="242" width="234" height="40" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="84" y="267" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="14" fill="#1f2328">skills/</text>
<rect x="68" y="292" width="234" height="40" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="84" y="317" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="14" fill="#1f2328">mcp.json</text>
</g>
<text x="185" y="358" text-anchor="middle" font-size="12" fill="#57606a">Amazon · Cursor · MSFT · OpenAI · Vercel</text>

<!-- CENTER: mcptoon hub -->
<rect x="492" y="210" width="196" height="96" rx="14" fill="#1a7f37" opacity="0.45" filter="url(#halo)"/>
<g filter="url(#soft)">
<rect x="478" y="196" width="224" height="124" rx="14" fill="#c9ecd5" stroke="#1a7f37" stroke-width="2.5"/>
</g>
<text x="590" y="238" text-anchor="middle" font-size="22" font-weight="800" fill="#1a7f37">mcptoon</text>
<text x="590" y="266" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="15" fill="#1f2328">plugin install</text>
<text x="590" y="292" text-anchor="middle" font-size="12" fill="#57606a">one command, all configs</text>

<!-- arrows -->
<text x="398" y="246" text-anchor="middle" font-size="12" fill="#8c959f">installs into</text>
<path d="M322 258 L470 258" stroke="#8c959f" stroke-width="3" marker-end="url(#arr)"/>
<text x="772" y="176" text-anchor="middle" font-size="12" fill="#8c959f">writes native config</text>
<path d="M702 258 C 770 258, 780 160, 842 160" stroke="#8c959f" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
<path d="M702 258 C 770 258, 780 210, 842 210" stroke="#8c959f" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
<path d="M702 258 L 842 260" stroke="#8c959f" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
<path d="M702 258 C 770 258, 780 310, 842 310" stroke="#8c959f" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
<path d="M702 258 C 770 258, 780 360, 842 360" stroke="#8c959f" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>

<!-- RIGHT: every agent -->
<text x="992" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#57606a" letter-spacing="1">EVERY AGENT CONFIG</text>
<g>
<rect x="842" y="140" width="300" height="40" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<circle cx="864" cy="160" r="9" fill="#1a7f37"/>
<path d="M859.5 160 l3 3 l6 -6" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="884" y="165" font-size="15" font-weight="600" fill="#1f2328">Claude Code</text>
<text x="1128" y="165" text-anchor="end" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#57606a">plugin:server</text>

<rect x="842" y="190" width="300" height="40" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<circle cx="864" cy="210" r="9" fill="#1a7f37"/>
<path d="M859.5 210 l3 3 l6 -6" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="884" y="215" font-size="15" font-weight="600" fill="#1f2328">Cursor</text>
<text x="1128" y="215" text-anchor="end" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#57606a">plugin:server</text>

<rect x="842" y="240" width="300" height="40" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<circle cx="864" cy="260" r="9" fill="#1a7f37"/>
<path d="M859.5 260 l3 3 l6 -6" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="884" y="265" font-size="15" font-weight="600" fill="#1f2328">Codex CLI</text>
<text x="1128" y="265" text-anchor="end" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#57606a">plugin:server</text>

<rect x="842" y="290" width="300" height="40" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<circle cx="864" cy="310" r="9" fill="#1a7f37"/>
<path d="M859.5 310 l3 3 l6 -6" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="884" y="315" font-size="15" font-weight="600" fill="#1f2328">Gemini CLI</text>
<text x="1128" y="315" text-anchor="end" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#57606a">plugin:server</text>

<rect x="842" y="340" width="300" height="40" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<circle cx="864" cy="360" r="9" fill="#1a7f37"/>
<path d="M859.5 360 l3 3 l6 -6" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="884" y="365" font-size="15" font-weight="600" fill="#1f2328">Cline / Windsurf</text>
<text x="1128" y="365" text-anchor="end" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#57606a">plugin:server</text>
</g>

<!-- BOTTOM: command chips -->
<g>
<rect x="194" y="416" width="176" height="30" rx="15" fill="#ffffff" stroke="#d0d7de"/>
<text x="282" y="435" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="13" fill="#1f2328">plugin scan</text>
<rect x="388" y="416" width="196" height="30" rx="15" fill="#c9ecd5" stroke="#1a7f37"/>
<text x="486" y="435" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#1a7f37">plugin install</text>
<rect x="602" y="416" width="176" height="30" rx="15" fill="#ffffff" stroke="#d0d7de"/>
<text x="690" y="435" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="13" fill="#1f2328">plugin list</text>
<rect x="796" y="416" width="190" height="30" rx="15" fill="#ffffff" stroke="#d0d7de"/>
<text x="891" y="435" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="13" fill="#1f2328">plugin remove</text>
</g>
</svg>
