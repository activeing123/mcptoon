<text x="984" y="311" font-size="11.5" fill="#57606a" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Consolas,'Courier New',monospace">shell</text>
<rect x="120" y="384" width="940" height="34" rx="10" fill="#eaf6ec"/>
<text x="590" y="406" font-size="14" fill="#1a7f37" text-anchor="middle" font-weight="700">Install once · new tools apply instantly · no agent restart</text>
