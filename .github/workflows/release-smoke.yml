name: Release smoke (PyPI)

# Layer 5: verify the *published* artifact, on the platform users actually run.
#
# `ci.yml` proves the wheel we build from this commit works. This workflow
# proves the wheel on PyPI — the bytes a `pip install mcptoon` actually pulls —
# still passes the README user path. It exists because a green CI run and a
# working PyPI release are two different claims: a bad upload, a missing file in
# the sdist, or a version that never made it to the index all leave CI green.
#
# Runs automatically on every published release, and by hand for any version.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "mcptoon version to verify (e.g. 0.8.3). Empty = latest on PyPI."
        required: false
        default: ""

jobs:
  pypi-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Wait for the version to appear on the PyPI simple index
      if: github.event_name == 'release'
      shell: bash
      run: |
        # `release: published` fires the moment the GitHub Release is created,
        # before publish.yml has finished uploading the wheel. Without this wait
        # the smoke test would install the *previous* version and report a false
        # failure on every release.
        #
        # Poll the *simple index*, not the JSON API. The JSON API's info.version
        # updates before the simple index that pip actually resolves from: on
        # 0.8.4 this wait passed on the API, then `pip install mcptoon` pulled
        # 0.8.3 and the smoke test failed on a bug that was already fixed. (The
        # ops skill records the same API-before-simple lag for v0.7.5.)
        want="${{ github.event.release.tag_name }}"
        want="${want#v}"
        echo "waiting for mcptoon ${want} on the PyPI simple index..."
        for i in $(seq 1 60); do
          if WANT="$want" python -c "import os,re,urllib.request as u; h=u.urlopen('https://pypi.org/simple/mcptoon/').read().decode(); raise SystemExit(0 if re.search('mcptoon-'+re.escape(os.environ['WANT'])+'-', h) else 1)"; then
            echo "found $want on the simple index"; exit 0
          fi
          echo "  attempt $i: simple index does not list $want yet"
          sleep 10
        done
        echo "timed out waiting for $want on the simple index"; exit 1

    - name: Install mcptoon from PyPI (not from the checkout)
      shell: bash
      run: |
        if [ -n "${{ github.event.inputs.version }}" ]; then
          python -m pip install "mcptoon==${{ github.event.inputs.version }}"
        else
          python -m pip install mcptoon
        fi

    - name: Confirm the import came from PyPI, not this checkout
      shell: bash
      env:
        # A release run knows the exact tag; a manual run verifies whatever pip picked.
        WANT: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.version }}
      run: |
        # 2026-10-02: 这条断言对 0.8.7 失败过一次（installed <wanted>，索引给了旧包），
        # 但同一 commit 手工重跑三平台全绿 —— 说明它是**时序**问题，不是逻辑错误。
        # 上面那步轮询的是 simple 索引上的**文件名出现**，而 pip 自己解析要走的链路
        # 另有 CDN 缓存，两边不是同一时刻可见。单次断言一旦撞上就必然报红，
        # 于是每次发版都留一条假红，久而久之没人再看这个 job。
        # 改成带重试：装不上/版本不对就重装，6 次 × 20s 内没转正才判失败。
        for i in 1 2 3 4 5 6; do
          if python -c "import os, pathlib, mcptoon; p = pathlib.Path(mcptoon.__file__).resolve(); assert 'site-packages' in str(p), f'imported from the tree, not PyPI: {p}'; want = os.environ.get('WANT', '').lstrip('v'); assert not want or mcptoon.__version__ == want, f'installed {mcptoon.__version__} but wanted {want} - the index served a stale copy'; print('PyPI install OK:', mcptoon.__version__, 'at', p)"; then
            exit 0
          fi
          echo "  attempt $i: not yet the released version; reinstalling in 20s"
          python -m pip install --upgrade --force-reinstall mcptoon || true
          sleep 20
        done
        echo "the index never served the released version"; exit 1

    - name: Install pytest
      run: python -m pip install pytest

    - name: Run the README user-path smoke tests against the PyPI install
      env:
        PYTHONUTF8: "1"
      run: python -m pytest tests/test_cli_smoke.py -v
