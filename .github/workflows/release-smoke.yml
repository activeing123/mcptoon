name: Release smoke (PyPI)

# Layer 5: verify the *published* artifact, on the platform users actually run.
#
# `ci.yml` proves the wheel we build from this commit works. This workflow
# proves the wheel on PyPI — the bytes a `pip install mcptoon` actually pulls —
# still passes the README user path. It exists because a green CI run and a
# working PyPI release are two different claims: a bad upload, a missing file in
# the sdist, or a version that never made it to the index all leave CI green.
#
# Runs automatically on every published release, and by hand for any version.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "mcptoon version to verify (e.g. 0.8.3). Empty = latest on PyPI."
        required: false
        default: ""

jobs:
  pypi-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Wait for the version to appear on PyPI
      if: github.event_name == 'release'
      shell: bash
      run: |
        # `release: published` fires the moment the GitHub Release is created,
        # which is before publish.yml has finished uploading the wheel. Without
        # this wait the smoke test would install the *previous* version and
        # report a false failure on every release. (publish-mcp.yml learned the
        # same lesson in v0.7.6/0.7.7.)
        want="${{ github.event.release.tag_name }}"
        want="${want#v}"
        echo "waiting for mcptoon ${want} on PyPI..."
        for i in $(seq 1 30); do
          have=$(python -c "import json,urllib.request; print(json.load(urllib.request.urlopen('https://pypi.org/pypi/mcptoon/json'))['info']['version'])" 2>/dev/null || echo "")
          if [ "$have" = "$want" ]; then echo "found $want"; exit 0; fi
          echo "  attempt $i: PyPI has '${have:-?}', want '$want'"
          sleep 10
        done
        echo "timed out waiting for $want on PyPI"; exit 1

    - name: Install mcptoon from PyPI (not from the checkout)
      shell: bash
      run: |
        if [ -n "${{ github.event.inputs.version }}" ]; then
          python -m pip install "mcptoon==${{ github.event.inputs.version }}"
        else
          python -m pip install mcptoon
        fi

    - name: Confirm the import came from PyPI, not this checkout
      shell: bash
      run: |
        python -c 'import mcptoon, pathlib; p = pathlib.Path(mcptoon.__file__).resolve(); assert "site-packages" in str(p), f"imported from the tree, not PyPI: {p}"; print("PyPI install OK:", mcptoon.__version__, "at", p)'

    - name: Install pytest
      run: python -m pip install pytest

    - name: Run the README user-path smoke tests against the PyPI install
      env:
        PYTHONUTF8: "1"
      run: python -m pytest tests/test_cli_smoke.py -v
