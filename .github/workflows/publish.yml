name: Publish to PyPI

on:
  release:
    types: [published]

concurrency:
  group: pypi-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Install build tools
      run: pip install build twine

    - name: Build package
      run: python -m build

    - name: Check if version already exists on PyPI
      run: |
        VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
        echo "Checking if mcptoon==${VERSION} already exists on PyPI..."
        if pip index versions mcptoon 2>/dev/null | grep -q "${VERSION}"; then
          echo "Version ${VERSION} already exists on PyPI. Skipping upload."
          echo "SKIP_UPLOAD=1" >> $GITHUB_ENV
        else
          echo "Version ${VERSION} not found on PyPI. Proceeding with upload."
        fi

    - name: Publish to PyPI
      if: env.SKIP_UPLOAD != '1'
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        # Strip any BOM from token (workaround for GitHub Secrets BOM injection)
        python -c "
        import os, sys
        token = os.environ.get('TWINE_PASSWORD', '')
        if token.startswith('\ufeff'):
            token = token[1:]
            print('WARNING: BOM detected and stripped from PyPI token', file=sys.stderr)
        # Write clean token to a file for twine
        with open('/tmp/.pypirc_token', 'w') as f:
            f.write(token)
        print(f'Token length: {len(token)}', file=sys.stderr)
        print(f'Token starts with pypi-: {token.startswith(\"pypi-\")}', file=sys.stderr)
        "
        TWINE_PASSWORD=$(cat /tmp/.pypirc_token) twine upload dist/* --verbose
