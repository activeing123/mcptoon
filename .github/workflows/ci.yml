name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install package
      run: pip install -e .

    - name: Install dev dependencies
      run: pip install pytest pytest-cov

    - name: Run tests
      run: python -m pytest tests/ -v --cov=mcptoon --cov-report=term-missing

    - name: Verify CLI works
      run: |
        mcptoon help
        mcptoon init
        mcptoon list

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install package
      run: pip install -e .

    - name: Check imports
      run: |
        python -c "import mcptoon; print(f'mcptoon v{mcptoon.__version__} OK')"
        python -c "from mcptoon.client import MCPClient; print('client OK')"
        python -c "from mcptoon.output import toon_encode, toon_decode; print('toon_encode OK')"
        python -c "from mcptoon.output import mcptoon_encode, mcptoon_decode; print('mcptoon_encode OK')"
        python -c "from mcptoon.router import call_tool; print('router OK')"

    - name: Verify zero dependencies
      run: |
        # Ensure no third-party imports in source
        ! grep -r "^import " src/mcptoon/ --include="*.py" | grep -v -E "(import json|import os|import sys|import time|import threading|import subprocess|import urllib|import pathlib|import shutil|import functools|import typing)"
        echo "Zero third-party dependencies confirmed"
