name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install ruff
      run: pip install ruff

    - name: Ruff check (zero F821/F841/B904 policy)
      run: ruff check src/mcptoon/ tests/ --select F821,F841,B904

    - name: Ruff check (full)
      run: ruff check src/mcptoon/ tests/

    - name: Install package
      run: pip install .

    - name: Check imports
      run: |
        python -c "import mcptoon; print(f'mcptoon v{mcptoon.__version__} OK')"
        python -c "from mcptoon.client import MCPClient; print('client OK')"
        python -c "from mcptoon.output import toon_encode, toon_decode; print('toon_encode OK')"
        python -c "from mcptoon.output import mcptoon_encode, mcptoon_decode; print('mcptoon_encode OK')"
        python -c "from mcptoon.router import call_tool; print('router OK')"
        python -c "from mcptoon.installer import install_npm; print('installer OK')"

    - name: Verify zero dependencies
      run: |
        # Ensure no third-party imports in source
        ! grep -r "^import " src/mcptoon/ --include="*.py" | grep -v -E "(import json|import os|import sys|import time|import threading|import subprocess|import urllib|import pathlib|import shutil|import functools|import typing|import re|import math)"
        ! grep -r "^from " src/mcptoon/ --include="*.py" | grep -v -E "(from __future__|from typing|from pathlib|from urllib|from functools|from datetime|from decimal|from \.toon_vendored|from \.cli|from \.client|from \.config|from \.output|from \.router|from \.manifest|from \.discover|from \.cache|from \.installer|from \.usage|from \.errors)"
        echo "Zero third-party dependencies confirmed"

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install package
      run: pip install .

    - name: Debug CLI on Windows
      if: runner.os == 'Windows'
      run: |
        python -m mcptoon serve --help 2>&1 || true
        python -m mcptoon help 2>&1 || true
        echo "---PYTHONPATH---"
        echo %PYTHONPATH%
        echo "---PIP SHOW---"
        pip show mcptoon

    - name: Install dev dependencies
      run: pip install pytest pytest-cov

    - name: Run tests
      run: python -m pytest tests/ -v --tb=long --cov=mcptoon --cov-report=term-missing
      env:
        PYTHONPATH: src

    - name: Verify CLI works
      run: |
        mcptoon help
        mcptoon init
        mcptoon list
