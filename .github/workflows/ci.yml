name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Install ruff (pinned — unpinned latest introduced new rules mid-stream)
      run: pip install "ruff==0.15.20"

    - name: Ruff check (zero F821/F841/B904 policy)
      run: ruff check src/mcptoon/ tests/ --select F821,F841,B904

    - name: Ruff check (full)
      run: ruff check src/mcptoon/ tests/

    - name: Install package
      run: pip install .

    - name: Check imports
      run: |
        python -c "import mcptoon; print(f'mcptoon v{mcptoon.__version__} OK')"
        python -c "from mcptoon.client import MCPClient; print('client OK')"
        python -c "from mcptoon.output import toon_encode, toon_decode; print('toon_encode OK')"
        python -c "from mcptoon.output import mcptoon_encode, mcptoon_decode; print('mcptoon_encode OK')"
        python -c "from mcptoon.router import call_tool; print('router OK')"
        python -c "from mcptoon.installer import install_npm; print('installer OK')"

    - name: Verify zero dependencies
      run: |
        # AST-based gate (grep allowlists silently missed `from . import x` styles)
        python scripts/check_zero_deps.py src/mcptoon

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install package
      run: pip install .

    - name: Debug CLI on Windows
      if: runner.os == 'Windows'
      run: |
        python -m mcptoon serve --help 2>&1 || true
        python -m mcptoon help 2>&1 || true
        echo "---PYTHONPATH---"
        echo %PYTHONPATH%
        echo "---PIP SHOW---"
        pip show mcptoon

    - name: Install dev dependencies
      # pytest-timeout is load-bearing: ~65 tests spawn real child processes, and
      # without a ceiling one wedged child hangs the whole job until the runner's
      # own 6-hour limit. The ceiling lives in pyproject (`timeout = 120`).
      run: pip install pytest pytest-cov pytest-timeout

    - name: Run tests
      run: python -m pytest tests/ -v --tb=long --cov=mcptoon --cov-report=term-missing
      env:
        PYTHONPATH: src
        PYTHONUTF8: "1"

    - name: Verify CLI works
      run: |
        mcptoon help
        mcptoon init
        mcptoon list

  # ── Layer 4: what unit tests cannot see ─────────────────────────────────
  # Every other job installs the *source tree* (`pip install .`). This one
  # builds the real wheel, installs the wheel, and runs the CLI the way a
  # first-time user does — because the artifact users get is the wheel, not the
  # tree. The 2026-09-29 `install --pack` crash lived only in the default code
  # path the CLI takes on a clean machine, with the whole suite green; this is
  # the job that would have gone red. It runs on three fresh VMs, so it is also
  # the "clean machine" check that no developer machine can be.
  install-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Build the wheel
      run: |
        python -m pip install --upgrade build
        python -m build --wheel --outdir dist

    - name: Install the built wheel (not the source tree)
      shell: bash
      run: |
        python -m pip install --force-reinstall --no-deps dist/*.whl
        python -c "import mcptoon; print('installed mcptoon', mcptoon.__version__)"

    - name: Install pytest
      run: python -m pip install pytest

    - name: Run the README user-path smoke tests against the installed wheel
      env:
        PYTHONUTF8: "1"
      run: python -m pytest tests/test_cli_smoke.py -v
