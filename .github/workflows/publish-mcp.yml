name: Publish to MCP Registry

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      reason:
        description: Why this run exists (backfill a missed release, retry, etc.)
        required: false
        default: manual

# Publishing is not idempotent-safe to interrupt: never cancel a record mid-push.
concurrency:
  group: mcp-registry-publish
  cancel-in-progress: false

# The registry proves ownership of io.github.activeing123/* from this workflow's
# OIDC token, so id-token: write is required and the job must run in this repo.
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Gives every registry publish a visible deploy history; this is what we lacked
    # when 0.7.0 and 0.7.2 were pushed from a laptop.
    environment: mcp-registry
    steps:
      - uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          ASSET="mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz"
          echo "fetching ${ASSET} from the latest registry release"
          curl -fsSL \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/${ASSET}" \
            | tar xz mcp-publisher
          ls -l mcp-publisher

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      # publish.yml fires on the same release event and uploads the wheel in
      # parallel; the registry validates packages[].version against PyPI, so
      # without this wait the first run 400s ("version not found"). Bit us on
      # 0.7.6 and 0.7.7 - both needed a manual workflow_dispatch retry.
      - name: Wait for PyPI to list the released version
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import json;print(json.load(open('server.json'))['packages'][0]['version'])")
          echo "waiting for PyPI to list mcptoon ${VERSION}"
          for i in $(seq 1 30); do
            if curl -fsSL https://pypi.org/pypi/mcptoon/json \
              | python3 -c "import json,sys;sys.exit(0 if json.load(sys.stdin)['info']['version']=='${VERSION}' else 1)"; then
              echo "PyPI lists ${VERSION} (checked $((i*10))s)"
              exit 0
            fi
            sleep 10
          done
          echo "PyPI did not list ${VERSION} within 5 minutes"
          exit 1

      - name: Publish server record
        run: ./mcp-publisher publish
