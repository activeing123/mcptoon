# Pre-commit hooks for mcptoon
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.0
    hooks:
      # Lint: zero-tolerance on F821/F841/B904 (bugs)
      - id: ruff
        name: ruff (bug check: F821/F841/B904)
        args: ["--select", "F821,F841,B904", "--no-fix"]
        stages: [pre-commit]

      # Lint: full check
      - id: ruff
        name: ruff (full lint)
        args: ["--fix"]
        stages: [pre-commit]

  - repo: local
    hooks:
      # Run tests before commit (fast subset)
      - id: pytest-quick
        name: pytest (quick smoke test)
        entry: python -m pytest tests/ -x -q
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit]
