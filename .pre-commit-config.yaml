# Pre-commit hooks for mcptoon
# Install: pip install pre-commit && pre-commit install
# Manual run: pre-commit run --all-files

repos:
  # Ruff — lint + auto-fix
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [check, --fix, --exit-non-zero-on-fix]
        files: ^(src|tests)/

  # Basic checks — trailing whitespace, newline, YAML/JSON syntax
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: debug-statements

  # Local hook — fast pytest (only changed test files)
  - repo: local
    hooks:
      - id: pytest-fast
        name: pytest (fast)
        entry: python -m pytest tests/ -x -q --tb=short --no-header
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit]
